<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Koleksi Anak | Fashion Minimalis</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#ff0000",
                        "background-light": "#ffffff",
                        "background-dark": "#121212",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0px",
                    },
                },
            },
        };
    </script>
    <style>
        body { font-family: "Inter", sans-serif; }
        .product-card:hover .quick-add {
            opacity: 1;
            transform: translateY(0);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div class="bg-stone-100 dark:bg-stone-900 py-2 text-center text-xs tracking-wider">
        <p>Gratis Ongkir dengan min. pembelian Rp699.000</p>
    </div>

    <nav class="sticky top-0 z-50 bg-background-light dark:bg-background-dark border-b border-stone-200 dark:border-stone-800">
        <div class="max-w-7xl mx-auto px-4 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="index.html" class="bg-primary text-white p-1 font-bold text-xl leading-none tracking-tighter flex flex-col items-center w-8 h-8 justify-center">
                        <span class="text-[14px]">HW</span>
                    </a>
                    <div class="hidden md:flex space-x-8 font-medium text-sm">
                        <a class="text-stone-500 hover:text-black dark:hover:text-white transition-colors" href="colection_wanita.html">WANITA</a>
                        <a class="text-stone-500 hover:text-black dark:hover:text-white transition-colors" href="colection_pria.html">PRIA</a>
                        <a class="border-b-2 border-primary pb-5 -mb-5" href="colection_anak.html">ANAK</a>
                    </div>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="#" class="p-1 hover:opacity-70"><span class="material-icons-outlined text-xl">search</span></a>
                    <a href="#" class="p-1 hover:opacity-70"><span class="material-icons-outlined text-xl">favorite_border</span></a>
                    <a href="#" class="p-1 hover:opacity-70"><span class="material-icons-outlined text-xl">person_outline</span></a>
                    <a href="keranjang.html" class="p-1 hover:opacity-70 relative inline-block">
                        <span class="material-icons-outlined text-xl">shopping_cart</span>
                        <span class="absolute -top-1 -right-1 bg-black dark:bg-white text-white dark:text-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center">2</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="bg-background-light dark:bg-background-dark border-b border-stone-100 dark:border-stone-900 overflow-x-auto hide-scrollbar">
        <div class="max-w-7xl mx-auto px-4 lg:px-8 flex space-x-8 py-3 text-xs font-medium whitespace-nowrap">
            <a class="text-stone-900 dark:text-stone-100 border-b border-stone-900 dark:border-stone-100" href="#">Koleksi Utama</a>
            <a class="text-stone-500 hover:text-stone-900 dark:hover:text-stone-100" href="#">kaos</a>
            <a class="text-stone-500 hover:text-stone-900 dark:hover:text-stone-100" href="#">Celana</a>
            <a class="text-stone-500 hover:text-stone-900 dark:hover:text-stone-100" href="#">jaket</a>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-2xl font-light tracking-tight">Koleksi Pakaian Anak</h1>
            <p class="text-sm text-stone-500 mt-2">Pakaian ceria dan tahan lama untuk petualangan si kecil</p>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-6 border-b border-gray-100 dark:border-gray-800 pb-6">
            <div class="flex flex-wrap gap-6">
                <button data-filter="all" onclick="filterAction('all')" class="filter-btn active border-b-2 border-black dark:border-white font-bold text-xs uppercase tracking-widest pb-1">Semua</button>
                <button data-filter="bjp" onclick="filterAction('bjp')" class="filter-btn text-gray-400 font-bold text-xs uppercase tracking-widest pb-1 hover:text-black dark:hover:text-white transition">Kaos</button>
                <button data-filter="km" onclick="filterAction('km')" class="filter-btn text-gray-400 font-bold text-xs uppercase tracking-widest pb-1 hover:text-black dark:hover:text-white transition">Kemeja</button>
                <button data-filter="cl" onclick="filterAction('cl')" class="filter-btn text-gray-400 font-bold text-xs uppercase tracking-widest pb-1 hover:text-black dark:hover:text-white transition">Celana</button>
                <button data-filter="op" onclick="filterAction('op')" class="filter-btn text-gray-400 font-bold text-xs uppercase tracking-widest pb-1 hover:text-black dark:hover:text-white transition">Outerwear</button>
            </div>
            <select id="sortOption" onchange="runFilterAndSort()" class="bg-transparent border-none text-xs font-bold uppercase tracking-widest focus:ring-0 cursor-pointer">
                <option value="newest">Urutkan: Terbaru</option>
                <option value="low">Harga: Terendah</option>
                <option value="high">Harga: Tertinggi</option>
            </select>
        </div>

        <div id="product-container" class="grid grid-cols-2 lg:grid-cols-4 gap-x-4 gap-y-12"></div>

        <div id="load-more-container" class="mt-16 flex justify-center hidden">
            <button onclick="loadMoreAction()" class="border border-black px-10 py-4 text-[11px] font-bold uppercase tracking-widest hover:bg-black hover:text-white transition-all duration-300">
                Tampilkan Lebih Banyak
            </button>
        </div>
        <div id="no-more-products" class="mt-8 text-center text-gray-500 hidden">
            <p class="text-sm">Semua produk telah ditampilkan</p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="entry-colection-anak.js"></script>
</body>
</html>
